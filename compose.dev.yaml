# Local infrastructure for `pnpm dev` (§15.12), on top of compose.yaml. The applications run on
# the host with hot reload; the infrastructure publishes its ports on 127.0.0.1 only.

services:
  web: { profiles: [apps] }
  api: { profiles: [apps] }
  worker: { profiles: [apps] }
  migrate: { profiles: [apps] }
  caddy: { profiles: [apps] }
  backup: { profiles: [apps] }

  postgres:
    ports: ['127.0.0.1:5432:5432']
    networks: [outbound]

  valkey:
    ports: ['127.0.0.1:6379:6379']
    networks: [outbound]

  seaweedfs:
    ports: ['127.0.0.1:8333:8333']
    networks: [outbound]

  # The development realm overlay (§15.12): on its first start, Keycloak imports the seeded team
  # accounts of the demo dataset with their fixed IDs; keycloak-config then applies the realm.
  keycloak:
    command: [start, --import-realm]
    environment:
      KC_HOSTNAME: http://localhost:8080/auth
      # A host firewall may drop the back-channel logout to the host; Keycloak then waits for the
      # connection only briefly instead of blocking the logout for minutes.
      KC_SPI_CONNECTIONS_HTTP_CLIENT__DEFAULT__ESTABLISH_CONNECTION_TIMEOUT_MILLIS: '2000'
    volumes:
      - ./docker/keycloak/dev:/opt/keycloak/data/import:ro
    ports: ['127.0.0.1:8080:8080']
    # Back-channel logout reaches the web application on the host.
    extra_hosts: ['host.docker.internal:host-gateway']

  # `trybun-web` for the web application on http://localhost:3000; e-mail goes to Mailpit.
  keycloak-config:
    environment:
      TRYBUN_WEB_URL: http://localhost:3000
      TRYBUN_WEB_INTERNAL_URL: http://host.docker.internal:3000
      TRYBUN_SMTP_HOST: mailpit
      TRYBUN_SMTP_PORT: 1025
      TRYBUN_SMTP_SECURITY: none
      TRYBUN_SMTP_USER: ''
      TRYBUN_MAIL_FROM: trybun@localhost

  clamav:
    ports: ['127.0.0.1:3310:3310']

  # Captures all outgoing e-mail: SMTP on port 1025, web UI on http://localhost:8025 (§15.1).
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']
    networks: [internal, outbound]
    mem_limit: 128m
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 10s
      timeout: 5s
      start_period: 10s
