# Releases (§2.11, §15.4, ADR 0006). On `main` and on every maintenance branch `release/X.Y.x`,
# release-please keeps the release pull request up to date; merging it – the human decision –
# creates the tag `vX.Y.Z` and a draft GitHub Release. "Run workflow" on such a branch tags a
# release candidate `X.Y.Z-rc.N` of its open release pull request instead. The images are then
# built and scanned – a critical vulnerability blocks the release – and, after the maintainer's
# approval of the environment `release`, pushed to ghcr.io with the SBOMs and the deployment
# package, and the release is published.
name: Release

on:
  push:
    branches: [main, 'release/*']
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: Release pull request
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The credentials of the release app, available to `main` and `release/*` only.
    environment: release-please
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.release.outputs.release_created && steps.release.outputs.tag_name || '' }}
    steps:
      # A pull request opened with GITHUB_TOKEN starts no CI, and only the release app may create
      # `v*` tags (tag ruleset).
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.token.outputs.token }}
          target-branch: ${{ github.ref_name }}
          # Maintenance branches release PATCH versions only.
          config-file: ${{ github.ref_name == 'main' && 'release-please-config.json' || 'release-please-config.maintenance.json' }}
          manifest-file: .release-please-manifest.json

  candidate:
    name: Release candidate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release-please
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: tag
        name: Tag the release candidate
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          head=$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BRANCH" --state open \
            --label 'autorelease: pending' --json headRefName --jq '.[0].headRefName // empty')
          if [ -z "$head" ]; then
            echo "::error::$BRANCH has no open release pull request to test."
            exit 1
          fi
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/.release-please-manifest.json?ref=$head" \
            -H 'Accept: application/vnd.github.raw+json' --jq '."."')
          tag="v$(node scripts/release.js candidate "$version")"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --prerelease --verify-tag \
            --title "$tag" --generate-notes
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare
    needs: [release-please, candidate]
    if: ${{ !cancelled() && (needs.release-please.outputs.tag != '' || needs.candidate.outputs.tag != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      latest: ${{ steps.metadata.outputs.latest }}
      image-tags: ${{ steps.metadata.outputs.image-tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag || needs.candidate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: metadata
        env:
          TAG: ${{ needs.release-please.outputs.tag || needs.candidate.outputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          node scripts/release.js metadata "$TAG" >> "$GITHUB_OUTPUT"

  images:
    name: Image ${{ matrix.service }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: .
            dockerfile: docker/web/Dockerfile
          - service: server
            context: .
            dockerfile: docker/server/Dockerfile
          - service: postgres
            context: docker/postgres
            dockerfile: docker/postgres/Dockerfile
    env:
      IMAGE: ghcr.io/trybun/${{ matrix.service }}:${{ needs.prepare.outputs.version }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # `/health` and the "About" page show the version of package.json (§2.11); the release pull
      # request has set it for a release, a release candidate sets it here.
      - name: Set the version of the release candidate
        if: ${{ needs.prepare.outputs.prerelease == 'true' }}
        run: node scripts/release.js set-version "$VERSION"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=trybun-${{ matrix.service }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT
      # No release with known critical vulnerabilities (§2.10).
      - name: Scan for critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'
      - name: Create the SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}
          format: cyclonedx-json
          output-file: trybun-${{ matrix.service }}-${{ env.VERSION }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      # The publish job pushes exactly the scanned image.
      - name: Export the image
        run: docker save "$IMAGE" | gzip > "image-${{ matrix.service }}.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.service }}
          path: |
            image-${{ matrix.service }}.tar.gz
            trybun-${{ matrix.service }}-${{ env.VERSION }}.cdx.json
          compression-level: 0
          retention-days: 7

  deployment-package:
    name: Deployment package
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/build-deployment-package.js "$VERSION" out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployment-package
          path: out/trybun-${{ needs.prepare.outputs.version }}.tar.gz
          retention-days: 7

  publish:
    name: Publish
    needs: [prepare, images, deployment-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Waits for the maintainer's approval; runs no code of the repository.
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      IMAGE_TAGS: ${{ needs.prepare.outputs.image-tags }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      LATEST: ${{ needs.prepare.outputs.latest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the images
        run: |
          for service in web server postgres; do
            docker load --input "artifacts/image-$service.tar.gz"
            for tag in $IMAGE_TAGS; do
              docker tag "ghcr.io/trybun/$service:$VERSION" "ghcr.io/trybun/$service:$tag"
              docker push "ghcr.io/trybun/$service:$tag"
            done
          done
      - name: Publish the GitHub Release
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum trybun-*.tar.gz trybun-*.cdx.json > SHA256SUMS
          gh release upload "$TAG" trybun-*.tar.gz trybun-*.cdx.json SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false --prerelease="$PRERELEASE" --latest="$LATEST"
