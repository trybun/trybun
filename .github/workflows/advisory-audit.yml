# Daily advisory audit (§2.10, §15.4): `pnpm audit --audit-level low` checks the committed lockfile
# of `main` for advisories of every severity, with the accepted risks of `auditConfig.ignoreGhsas`
# left out, and the exceptions of `pnpm-workspace.yaml` for stale entries (`minimumReleaseAgeExclude`
# older than `minimumReleaseAge` or not in the lockfile, accepted advisories with a fix or withdrawn,
# `overrides` whose vulnerable version no dependency asks for), and keeps one tracking
# issue current – opened or reopened while advisories or stale exceptions remain, closed when both
# are gone. It never blocks a pull request; a finding keeps the run green, and the run fails only
# when the audit, a lookup of the registry or the advisory API, or the issue cannot be done. **Run workflow** on another
# branch is a dry run that writes the job summary only. No secrets; no `pnpm install`, so no
# dependency code runs in the job that holds `issues: write`.
name: Advisory audit

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Advisory audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # pnpm exits with 1 both for findings and for an error; the script tells them apart by the
      # output, which is empty on an error (the message stays in this log).
      - name: Audit the lockfile
        run: pnpm audit --audit-level low --json > "$RUNNER_TEMP/audit.json" || true
      # The effective settings of `pnpm-workspace.yaml`, as pnpm applies them; read by the script to
      # check the exceptions against the registry's publish dates and the GitHub advisory API.
      - name: Read the pnpm settings
        run: pnpm config list --json > "$RUNNER_TEMP/config.json"
      # The dependency tree of the committed lockfile, read without `node_modules`; the script checks
      # the exclusions against it and the `overrides` against the ranges the dependents declare.
      - name: Read the lockfile
        run: pnpm list -r --depth Infinity --lockfile-only --json > "$RUNNER_TEMP/lockfile.json"
      - name: Update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/advisory-audit.js sync "$RUNNER_TEMP/audit.json" "$RUNNER_TEMP/config.json"
          "$RUNNER_TEMP/lockfile.json"
