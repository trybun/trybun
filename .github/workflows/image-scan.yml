# Daily image scan (§2.10, §15.4): Trivy scans the published images of the supported series
# (§2.11) and the images built from `main` for critical vulnerabilities, with the accepted risks of
# .trivyignore.yaml, and uploads the results to GitHub code scanning. A finding opens a code
# scanning alert; an accepted risk past its expiry date is reported again; a vulnerability that is
# gone closes its alert with the next upload of the same category. A failed run on `main` keeps one
# tracking issue open (job `report`, #568). No secrets, read-only permissions plus the upload of
# the results and the tracking issue.
name: Image scan

on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions: {}

# `bash` runs `bash --noprofile --norc -eo pipefail {0}`: a failed command in a pipe fails the
# step (the default `bash -e` checks only the last command of a pipe).
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  series:
    name: Supported series
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      current: ${{ steps.series.outputs.current }}
      previous: ${{ steps.series.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - id: series
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName,publishedAt,isDraft,isPrerelease > "$RUNNER_TEMP/releases.json"
          node scripts/release.js supported-series "$RUNNER_TEMP/releases.json" | tee -a "$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.service }} (${{ matrix.slot }})
    needs: series
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: [web, server, postgres, backup]
        # `main`: built from the branch; `current` and `previous`: the published `X.Y` tags of
        # the supported series. Each slot keeps its code scanning category when the series moves.
        slot: [main, current, previous]
        include:
          - service: web
            context: .
            dockerfile: docker/web/Dockerfile
          - service: server
            context: .
            dockerfile: docker/server/Dockerfile
          - service: postgres
            context: docker/postgres
            dockerfile: docker/postgres/Dockerfile
          - service: backup
            context: docker/backup
            dockerfile: docker/backup/Dockerfile
    env:
      SERIES: ${{ matrix.slot == 'current' && needs.series.outputs.current || matrix.slot == 'previous' && needs.series.outputs.previous || '' }}
      SARIF: trivy-${{ matrix.service }}-${{ matrix.slot }}.sarif
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Choose the image
        id: image
        env:
          SERVICE: ${{ matrix.service }}
          SLOT: ${{ matrix.slot }}
        run: |
          if [ "$SLOT" = main ]; then
            echo "ref=trybun-scan/$SERVICE:main" >> "$GITHUB_OUTPUT"
          elif [ -n "$SERIES" ]; then
            echo "ref=ghcr.io/trybun/$SERVICE:$SERIES" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ matrix.slot == 'main' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: ${{ matrix.slot == 'main' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          provenance: false
          tags: ${{ steps.image.outputs.ref }}
      # The packages stay private until the maintainer makes them public (ADR 0006).
      - if: ${{ matrix.slot != 'main' && steps.image.outputs.ref != '' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Scan for critical vulnerabilities
        if: ${{ steps.image.outputs.ref != '' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ steps.image.outputs.ref }}
          scanners: vuln
          severity: CRITICAL
          # Without it the SARIF report contains every severity.
          limit-severities-for-sarif: true
          format: sarif
          output: ${{ env.SARIF }}
          trivyignores: .trivyignore.yaml
      # A slot without an image (no release yet, or the previous series no longer supported)
      # uploads an empty result, which closes the alerts left in its category.
      - name: Report no image
        if: ${{ steps.image.outputs.ref == '' }}
        run: |
          echo '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"Trivy","informationUri":"https://github.com/aquasecurity/trivy","rules":[]}},"results":[]}]}' > "$SARIF"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ env.SARIF }}
          category: image-scan/${{ matrix.service }}/${{ matrix.slot }}

  # One tracking issue per outage (#568): a failed run on `main` opens or reopens it with a comment,
  # the next successful run on `main` closes it. A run on another branch writes the job summary
  # only. No checkout and no repository code in the job that holds `issues: write`.
  report:
    name: Report the scan
    needs: [series, scan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          PASSED: ${{ needs.series.result == 'success' && needs.scan.result == 'success' }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          title='Image scan fails'
          failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | "- " + .name')
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --label image-scan \
            --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | sort_by(.number) | last | .number // empty")
          if [ "$PASSED" = true ]; then
            summary="The scan passed."
          else
            summary=$(printf 'The scan failed in [this run](%s):\n\n%s' "$RUN_URL" "${failed:-- (no job reported a failure; a job was skipped)}")
          fi
          printf '%s\n' "$summary" >> "$GITHUB_STEP_SUMMARY"
          if [ "$ON_MAIN" != true ]; then
            echo "Not on main: dry run, the tracking issue is left as it is." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$PASSED" = true ]; then
            if [ -n "$issue" ] && [ "$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = OPEN ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "The scan passed again in [this run]($RUN_URL)."
            fi
            exit 0
          fi
          if [ -z "$issue" ]; then
            body=$(printf 'The daily image scan (`.github/workflows/image-scan.yml`) fails on `main`, so some images are not scanned. This issue is opened and updated by the workflow and closed by its next successful run.\n\n%s' "$summary")
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label image-scan --body "$body"
          else
            if [ "$(gh issue view "$issue" --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = CLOSED ]; then
              gh issue reopen "$issue" --repo "$GITHUB_REPOSITORY"
            fi
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "$summary"
          fi
