# Quality gates of every pull request (§2.14). The job names are the required status checks of
# the ruleset "Protect main"; renaming a job changes the ruleset too.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Type check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Chromium for the story tests of @trybun/ui (Vitest browser mode, §2.14).
      - run: pnpm --filter @trybun/ui exec playwright install --with-deps --only-shell chromium
      # Unit and integration tests (Testcontainers on the runner's Docker) in one run; the
      # coverage thresholds are checked on the combined result.
      - run: pnpm test:coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build

  # The device projects in shards and the Lighthouse budget in its own job (#510); the job
  # "E2E and Lighthouse" merges their reports and is the required check.
  e2e-shard:
    name: E2E (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The local environment (§15.12) with the seeded accounts and the optional services of
      # `.env.example` – SeaweedFS and ClamAV, which the attachments of the portal tests need.
      # It starts in the background while the dependencies and browsers install and the build
      # runs, and is awaited before the seed (#510).
      - name: Start the infrastructure
        run: |
          cp .env.example .env
          nohup sh -c 'docker compose -f compose.yaml -f compose.dev.yaml up -d --wait && docker compose -f compose.yaml -f compose.dev.yaml wait keycloak-config; echo $? > "$RUNNER_TEMP/infra.exit"' > "$RUNNER_TEMP/infra.log" 2>&1 &
      - uses: ./.github/actions/setup
      # Chromium for the phone and desktop projects, WebKit for the tablet (§2.9).
      - run: pnpm --filter @trybun/web exec playwright install --with-deps chromium webkit
      # Production builds: the Lighthouse budget applies to them. Playwright starts the API and
      # the web application (playwright.config.ts).
      - run: pnpm build
      - name: Wait for the infrastructure
        timeout-minutes: 5
        run: |
          until [ -e "$RUNNER_TEMP/infra.exit" ]; do sleep 1; done
          cat "$RUNNER_TEMP/infra.log"
          exit "$(cat "$RUNNER_TEMP/infra.exit")"
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm --filter @trybun/web exec playwright test --project phone --project tablet --project desktop --shard=${{ matrix.shard }}/3 --reporter=github,blob
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: apps/web/blob-report/
          retention-days: 1

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The local environment (§15.12) with the seeded accounts and the optional services of
      # `.env.example` – SeaweedFS and ClamAV, which the attachments of the portal tests need.
      # It starts in the background while the dependencies and browsers install and the build
      # runs, and is awaited before the seed (#510).
      - name: Start the infrastructure
        run: |
          cp .env.example .env
          nohup sh -c 'docker compose -f compose.yaml -f compose.dev.yaml up -d --wait && docker compose -f compose.yaml -f compose.dev.yaml wait keycloak-config; echo $? > "$RUNNER_TEMP/infra.exit"' > "$RUNNER_TEMP/infra.log" 2>&1 &
      - uses: ./.github/actions/setup
      - run: pnpm --filter @trybun/web exec playwright install --with-deps chromium
      # Production builds: the Lighthouse budget applies to them. Playwright starts the API and
      # the web application (playwright.config.ts).
      - run: pnpm build
      - name: Wait for the infrastructure
        timeout-minutes: 5
        run: |
          until [ -e "$RUNNER_TEMP/infra.exit" ]; do sleep 1; done
          cat "$RUNNER_TEMP/infra.log"
          exit "$(cat "$RUNNER_TEMP/infra.exit")"
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm --filter @trybun/web exec playwright test --project lighthouse --reporter=github,blob
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-lighthouse
          path: apps/web/blob-report/
          retention-days: 1

  e2e-report:
    # The merged HTML report of the shards; not a required check, so it does not lengthen the gate.
    name: E2E report
    needs: [e2e-shard, lighthouse]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          merge-multiple: true
          path: apps/web/all-blob-reports
      - run: pnpm --filter @trybun/web exec playwright merge-reports --reporter html ./all-blob-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  e2e:
    name: E2E and Lighthouse
    needs: [e2e-shard, lighthouse]
    # A job skipped after a failed need would count as a passing required check.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every E2E job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  spec:
    name: Specification consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check § references
        run: node scripts/check-spec-references.js
      - name: Check links and headings
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --config lychee.toml --no-progress './**/*.md'

  audit:
    name: Vulnerability audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # High and critical advisories of the lockfile block; accepted risks without a fixed
      # version are listed with their reason in pnpm-workspace.yaml (§2.10).
      - run: pnpm audit --audit-level high

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
