packages:
  - apps/*
  - packages/*

# Rule 10: a new version is installed only after a 7-day cooldown (in minutes).
minimumReleaseAge: 10080
# Security fixes skip the cooldown (§2.10); each entry pins the exact fixed version and is removed
# once that version is older than 7 days.
minimumReleaseAgeExclude:
  # GHSA-27r3-jxmh-p828, body-parser >=2.0.0 <2.4.0: DoS through trailing bytes after a compressed body (high).
  - body-parser@2.4.0
  # GHSA-q7qp-rjg7-q26m, multer >=2.0.0 <2.5.0: DoS through a pending asynchronous fileFilter (high).
  - multer@2.5.0

# Security fixes for transitive dependencies pinned to an exact vulnerable version by their parent.
# Remove an entry once the parent depends on the fixed version.
overrides:
  # @nestjs/platform-express 12.2.0 still pins multer 2.4.0 (GHSA-q7qp-rjg7-q26m).
  multer@2.4.0: 2.5.0

# Dependencies allowed to run install scripts; every other one is refused.
allowBuilds:
  # Builds from source only when no prebuilt binary matches; the binaries come as optional
  # dependencies (next-intl's message extraction, not used at run time).
  '@parcel/watcher': false
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  prisma: true
  protobufjs: false
  ssh2: false
  unrs-resolver: true

peerDependencyRules:
  allowedVersions:
    # openapi-typescript 7 declares TypeScript 5 only; verified with TypeScript 6 in S0-01.
    openapi-typescript>typescript: '6'
    # @nest-lab/throttler-storage-redis 1.2 declares NestJS up to 11 (jmcdo29/nest-lab#75); verified
    # with NestJS 12 on Valkey by rate-limiting.integration.spec.ts (ADR 0007).
    '@nest-lab/throttler-storage-redis>@nestjs/common': '12'
    '@nest-lab/throttler-storage-redis>@nestjs/core': '12'

# Accepted risks of the vulnerability audit (Rule 10, §2.10): advisories without a fixed version,
# each with the reason and the mitigation. Remove an entry as soon as a fixed version exists.
auditConfig:
  ignoreGhsas:
    # braces <=3.0.3, stack exhaustion through deeply nested patterns; no fixed version (2026-10-21).
    # Development only (ESLint plugins through micromatch); patterns come from the repository's own
    # lint configuration, never from untrusted input.
    - GHSA-vfj7-8cjw-p6xm
