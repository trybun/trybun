# Realm of Trybun, applied by keycloak-config-cli on installation and on every update (§15.5).
# Every setting in this file is managed by Trybun and overwritten on every run; settings an
# Administrator changes in Keycloak that are not listed here are left untouched. The `env:` values
# come from `.env` through the `keycloak-config` service (docker/keycloak/apply-config.sh).
realm: trybun
enabled: true
displayName: Trybun
sslRequired: external

# No open registration (§7.4): accounts are created by invitations and the first-run wizard.
registrationAllowed: false
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
editUsernameAllowed: false
resetPasswordAllowed: true
rememberMe: false

# Translated login screens (§13.1, §15.5): the theme `trybun` is generated from the message
# catalogues of @trybun/i18n (docker/keycloak/themes). Keycloak shows the language the web
# application passes in `ui_locales`, else the browser language, else the default language.
internationalizationEnabled: true
supportedLocales: [en, pl]
defaultLocale: $(env:TRYBUN_DEFAULT_LANGUAGE:-en)
loginTheme: trybun

# Password policy (§7.4, §13.5): OWASP ASVS 5.0 and NIST SP 800-63B – at least 15 and at most 64
# characters, not the e-mail address or user name, not in the blocklist of common passwords
# (docker/keycloak/password-blocklists), no composition rules and no expiry; Argon2 hashing. Keycloak
# checks it when a password is set. The lengths equal PASSWORD_MIN_LENGTH and PASSWORD_MAX_LENGTH of
# @trybun/contracts/users (checked by its tests).
passwordPolicy: length(15) and maxLength(64) and notEmail and notUsername and passwordBlacklist(trybun.txt) and hashAlgorithm(argon2)

# Brute-force detection (§14.4): 5 failures lock the account for 1 minute, the wait doubles up to
# 15 minutes; never a permanent lockout.
bruteForceProtected: true
permanentLockout: false
failureFactor: 5
waitIncrementSeconds: 60
maxFailureWaitSeconds: 900
bruteForceStrategy: MULTIPLE
maxDeltaTimeSeconds: 43200
quickLoginCheckMilliSeconds: 1000
minimumQuickLoginWaitSeconds: 60

# Lifetimes (§14.4): 5-minute access tokens, refresh tokens rotated on every use. The session
# lifetimes are those of end users; the web session ends the sessions of the team earlier, with
# their Keycloak session (apps/web/src/lib/auth/session-lifetimes.ts, which the tests check).
accessTokenLifespan: 300
ssoSessionIdleTimeout: 28800
ssoSessionMaxLifespan: 2592000
revokeRefreshToken: true
refreshTokenMaxReuse: 0

# Login and admin events (§13.5), kept for 14 days (§13.2); admin events without representations,
# which would contain personal data.
eventsEnabled: true
eventsExpiration: 1209600
adminEventsEnabled: true
adminEventsDetailsEnabled: false

# Team accounts are members of the group `team` (§7.4), kept in sync by the server. The group
# grants the realm role `team`, which the sign-in flows use to require 2FA; the application never
# reads roles from tokens (§14.4).
roles:
  realm:
    - name: team
      description: Team member; sign-in requires 2FA.
groups:
  - name: team
    realmRoles: [team]

# 2FA for the team (§7.4): after the password form and after every sign-in through an identity
# provider, members of the role `team` must enter a one-time password; without one, Keycloak
# requires its set-up before the sign-in completes.
browserFlow: trybun browser
authenticationFlows:
  - alias: trybun browser
    description: Browser sign-in with mandatory 2FA for the team.
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-cookie
        requirement: ALTERNATIVE
        priority: 10
        authenticatorFlow: false
      - authenticator: identity-provider-redirector
        requirement: ALTERNATIVE
        priority: 20
        authenticatorFlow: false
      - flowAlias: trybun browser forms
        requirement: ALTERNATIVE
        priority: 30
        authenticatorFlow: true
  - alias: trybun browser forms
    description: Password form, then 2FA for the team.
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-username-password-form
        authenticatorConfig: trybun password reference
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - flowAlias: trybun team 2fa
        requirement: CONDITIONAL
        priority: 20
        authenticatorFlow: true
  - alias: trybun post broker login
    description: 2FA for the team after a sign-in through an identity provider.
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - flowAlias: trybun team 2fa after broker login
        requirement: CONDITIONAL
        priority: 10
        authenticatorFlow: true
      # A flow whose only step is a skipped condition fails: without this step, the sign-in of an
      # end user through Microsoft or Google would be refused (found in S1-03).
      - authenticator: allow-access-authenticator
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
  - alias: trybun team 2fa
    description: One-time password for members of the role `team`.
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-role
        authenticatorConfig: trybun team member
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - authenticator: auth-otp-form
        authenticatorConfig: trybun otp reference
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
  - alias: trybun team 2fa after broker login
    description: One-time password for members of the role `team`.
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-role
        authenticatorConfig: trybun team member after broker login
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - authenticator: auth-otp-form
        authenticatorConfig: trybun otp reference after broker login
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
  # The first sign-in through GitHub, Microsoft or Google (ADR 0009): a Keycloak user is created
  # only when the sign-in was started from an invitation, which requests the optional client scope
  # `invitation`; otherwise the provider can only be linked to an existing Keycloak user, after a
  # sign-in to it. The scope is a front-channel marker, not a security boundary: a Keycloak user
  # gives no access until the API binds it to an account with a valid invitation, and users without
  # an account are deleted after 24 hours.
  - alias: trybun first broker login
    description: First sign-in through an identity provider; new users only from an invitation.
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: idp-review-profile
        authenticatorConfig: trybun review profile
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - flowAlias: trybun first broker login from an invitation
        requirement: CONDITIONAL
        priority: 20
        authenticatorFlow: true
      - flowAlias: trybun first broker login without an invitation
        requirement: CONDITIONAL
        priority: 30
        authenticatorFlow: true
  - alias: trybun first broker login from an invitation
    description: Creates the Keycloak user, or links an existing one after a sign-in to it.
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-client-scope
        authenticatorConfig: trybun invitation requested
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - flowAlias: trybun first broker login create or link
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: true
  - alias: trybun first broker login create or link
    description: Creates a user if none has the address, else links the existing one.
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: idp-create-user-if-unique
        authenticatorConfig: trybun create unique user
        requirement: ALTERNATIVE
        priority: 10
        authenticatorFlow: false
      - flowAlias: trybun first broker login link existing user
        requirement: ALTERNATIVE
        priority: 20
        authenticatorFlow: true
  - alias: trybun first broker login link existing user
    description: Links an existing user after confirmation and a sign-in to it.
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: idp-confirm-link
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - flowAlias: trybun first broker login reauthentication
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: true
  - alias: trybun first broker login without an invitation
    description: Links an existing user only; never creates one.
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-client-scope
        authenticatorConfig: trybun invitation not requested
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - authenticator: idp-detect-existing-broker-user
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
      - authenticator: idp-confirm-link
        requirement: REQUIRED
        priority: 30
        authenticatorFlow: false
      - flowAlias: trybun first broker login reauthentication without an invitation
        requirement: REQUIRED
        priority: 40
        authenticatorFlow: true
  # Never linked by a matching e-mail address alone (§7.4): the person signs in to the existing
  # user with its password and, if configured, its one-time password. No e-mail verification:
  # Keycloak sends no e-mails (ADR 0009).
  - alias: trybun first broker login reauthentication
    description: Sign-in to the existing user before it is linked.
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: idp-username-password-form
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - flowAlias: trybun first broker login otp
        requirement: CONDITIONAL
        priority: 20
        authenticatorFlow: true
  - alias: trybun first broker login otp
    description: One-time password of a user who has one.
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-configured
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - authenticator: auth-otp-form
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
  - alias: trybun first broker login reauthentication without an invitation
    description: Sign-in to the existing user before it is linked.
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: idp-username-password-form
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - flowAlias: trybun first broker login otp without an invitation
        requirement: CONDITIONAL
        priority: 20
        authenticatorFlow: true
  - alias: trybun first broker login otp without an invitation
    description: One-time password of a user who has one.
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-configured
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - authenticator: auth-otp-form
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
authenticatorConfig:
  # References of the authentication methods in the `amr` claim (RFC 8176). A method stays in the
  # claim only for `maxAge` seconds after the sign-in – the maximum session lifetime, so refreshed
  # tokens keep it.
  - alias: trybun password reference
    config:
      default.reference.value: pwd
      default.reference.maxAge: '2592000'
  - alias: trybun otp reference
    config:
      default.reference.value: otp
      default.reference.maxAge: '2592000'
  - alias: trybun otp reference after broker login
    config:
      default.reference.value: otp
      default.reference.maxAge: '2592000'
  - alias: trybun team member
    config:
      condUserRole: team
      negate: 'false'
  - alias: trybun team member after broker login
    config:
      condUserRole: team
      negate: 'false'
  # Missing names are asked for on the first sign-in through a provider (Keycloak's default).
  - alias: trybun review profile
    config:
      update.profile.on.first.login: missing
  - alias: trybun create unique user
    config:
      require.password.update.after.registration: 'false'
  - alias: trybun invitation requested
    config:
      client_scope: invitation
      negate: 'false'
  - alias: trybun invitation not requested
    config:
      client_scope: invitation
      negate: 'true'

# Requested by the acceptance page of an invitation for a sign-in through a provider (ADR 0009),
# the condition of `trybun first broker login`. It adds nothing to the tokens.
clientScopes:
  - name: invitation
    description: Sign-in started from an invitation link.
    protocol: openid-connect
    attributes:
      include.in.token.scope: 'false'
      display.on.consent.screen: 'false'

clients:
  # Sign-in of the web application (Auth.js, §14.4): confidential, authorization code with PKCE.
  - clientId: trybun-web
    name: Trybun
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:TRYBUN_KEYCLOAK_WEB_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    frontchannelLogout: false
    # Roles are never read from tokens (§14.4), so tokens carry none.
    fullScopeAllowed: false
    rootUrl: $(env:TRYBUN_WEB_URL)
    baseUrl: /
    redirectUris: [$(env:TRYBUN_WEB_URL)/api/auth/callback/keycloak]
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: $(env:TRYBUN_WEB_URL)/*
      # Back-channel logout deletes the web session (§14.4); called over the internal network.
      backchannel.logout.url: $(env:TRYBUN_WEB_INTERNAL_URL)/api/auth/backchannel-logout
      backchannel.logout.session.required: 'true'
      backchannel.logout.revoke.offline.tokens: 'true'
    defaultClientScopes: [basic, acr, profile, email]
    optionalClientScopes: [invitation]
    protocolMappers:
      # Access tokens are issued for the API (`aud` contains `trybun-api`, §14.4).
      - name: audience trybun-api
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        config:
          included.client.audience: trybun-api
          access.token.claim: 'true'
          id.token.claim: 'false'
          introspection.token.claim: 'true'
      # Authentication methods of the sign-in (`amr`), so the API can require completed 2FA for
      # team actions (§7.4).
      - name: authentication methods
        protocol: openid-connect
        protocolMapper: oidc-amr-mapper
        config:
          access.token.claim: 'true'
          id.token.claim: 'true'
          introspection.token.claim: 'true'
  # Audience of the access tokens; the API validates tokens and has no sign-in of its own.
  - clientId: trybun-api
    name: Trybun API
    enabled: true
    protocol: openid-connect
    bearerOnly: true
    publicClient: false
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
  # The server manages users, required actions and the group `team` through the Admin API (§14.4).
  - clientId: trybun-server
    name: Trybun server
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:TRYBUN_KEYCLOAK_SERVER_CLIENT_SECRET)
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    defaultClientScopes: [basic]
    optionalClientScopes: []

# Permissions of the service account of `trybun-server`: managing the users of this realm only.
users:
  - username: service-account-trybun-server
    enabled: true
    serviceAccountClientId: trybun-server
    clientRoles:
      realm-management: [manage-users, view-users, query-users, query-groups]
