# clamd of Trybun (ADR 0008, §13.3), mounted over /etc/clamav/clamd.conf of clamav/clamav 1.5.4.
# Options not listed keep the defaults of clamd 1.5.4 (/etc/clamav/clamd.conf.sample in the image).

# The settings of the image: its start script waits for the local socket, and the health check
# (clamdcheck.sh) and the Worker use the TCP port.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# A file clamd cannot scan completely is reported as Heuristics.Limits.Exceeded.* or
# Heuristics.Encrypted.* instead of clean; the Worker removes it as `rejected`.
AlertExceedsMax yes
AlertEncryptedArchive yes

# Above the largest attachment (TRYBUN_ATTACHMENT_MAX_SIZE_MB, at most 100 MB): clamd closes a
# longer INSTREAM stream, which the Worker reports as a failed scan.
StreamMaxLength 101M
# The content extracted from one upload (the default of clamd 1.5.4).
MaxScanSize 400M
# Above MaxScanSize: clamd 1.5.4 scans only the first MaxFileSize bytes of a larger file inside an
# archive without an alert, so such a file must also exceed MaxScanSize, which alerts.
MaxFileSize 401M
# The time limit of a ZIP archive (clamd 1.5.4 applies it to nothing else), below the 100 seconds
# after which the Worker gives up a scan: a slower archive is reported, not retried.
MaxScanTime 60000

# The Worker gives up a scan after 100 seconds, before clamd waits longer for its data.
ReadTimeout 120
